name: Build S13 candidate

on:
  push:
    branches:
      - chatgpt/s13-frame-presentation

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact S13 candidate from accepted main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          EXPECTED_BASE="aeadf51a8460803edbfc062adac7ea6a60724629"
          git fetch origin main
          ACTUAL_BASE="$(git rev-parse origin/main)"
          if [ "$ACTUAL_BASE" != "$EXPECTED_BASE" ]; then
            echo "main moved: expected $EXPECTED_BASE, found $ACTUAL_BASE" >&2
            exit 1
          fi

          git checkout --detach origin/main
          git checkout "$SOURCE_SHA" -- \
            render/RenderVulkan/RenderVulkan.upp \
            render/RenderVulkan/RenderVulkanSurfaceSession.h \
            render/RenderVulkan/RenderVulkanTestHooks.h \
            render/RenderVulkan/RenderVulkanFrame.cpp \
            tests/RenderVulkanFrameTest/RenderVulkanFrameTest.upp \
            tests/RenderVulkanFrameTest/main.cpp

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Frame implementation: avoid naming a private nested type from a free helper.
          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              'template <class T>\nstatic bool ResolveFrameProc(T& out, const VulkanSurfaceSession::FrameInterop& interop, const char *name, String& error)',
              'template <class T, class Interop>\nstatic bool ResolveFrameProc(T& out, const Interop& interop, const char *name, String& error)')

          # Current frame ownership state must become explicitly cleared when no private state exists.
          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\tif(!state) {\n\t\tframe_report.state_cleared = true;\n\t\tframe_report.image_acquired = false;\n\t\treturn frame_report.cleanup_ok;\n\t}''',
              '''\tif(!state) {\n\t\tframe_report.sync_created = false;\n\t\tframe_report.state_cleared = true;\n\t\tframe_report.image_acquired = false;\n\t\tframe_report.image_index = -1;\n\t\treturn frame_report.cleanup_ok;\n\t}''')

          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\tdelete state;\n\tframe_impl = nullptr;\n\tframe_report.state_cleared = true;\n\tframe_report.image_acquired = false;\n\tframe_report.cleanup_ok = frame_report.cleanup_ok && ok;''',
              '''\tdelete state;\n\tframe_impl = nullptr;\n\tframe_report.sync_created = false;\n\tframe_report.state_cleared = true;\n\tframe_report.image_acquired = false;\n\tframe_report.image_index = -1;\n\tframe_report.cleanup_ok = frame_report.cleanup_ok && ok;''')

          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\t\tif(vr != VK_SUCCESS) {\n\t\t\tDestroyUnpublishedFrameState(interop.device, *created);\n\t\t\tframe_report.error = String("Vulkan frame synchronization creation failed: ") + AsString((int)vr);\n\t\t\tframe_report.state_cleared = true;\n\t\t\treturn false;\n\t\t}''',
              '''\t\tif(vr != VK_SUCCESS) {\n\t\t\tDestroyUnpublishedFrameState(interop.device, *created);\n\t\t\tframe_report.sync_created = false;\n\t\t\tframe_report.error = String("Vulkan frame synchronization creation failed: ") + AsString((int)vr);\n\t\t\tframe_report.state_cleared = true;\n\t\t\treturn false;\n\t\t}''')

          # Test globals must be reset even when an assertion path returns early.
          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\tresult = VulkanFrameTestResult();\n\tg_frame_test_base_resolver = resolver;\n\tg_frame_test_missing_proc = nullptr;\n\tg_frame_test_injection = VulkanFrameTestInjection();\n\tClearVulkanRuntimeDeviceDiagnostics();''',
              '''\tresult = VulkanFrameTestResult();\n\tg_frame_test_base_resolver = resolver;\n\tg_frame_test_missing_proc = nullptr;\n\tg_frame_test_injection = VulkanFrameTestInjection();\n\tstruct FrameTestReset {\n\t\t~FrameTestReset()\n\t\t{\n\t\t\tg_frame_test_base_resolver = nullptr;\n\t\t\tg_frame_test_missing_proc = nullptr;\n\t\t\tg_frame_test_injection = VulkanFrameTestInjection();\n\t\t}\n\t} frame_test_reset;\n\tClearVulkanRuntimeDeviceDiagnostics();''')

          # Exercise the successful VK_SUBOPTIMAL_KHR acquire path explicitly.
          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\tresult.missing_procedure_recovered = true;\n\n\tif(!session.DestroyFrameState()) return false;\n\tg_frame_test_injection.acquire_out_of_date = true;''',
              '''\tresult.missing_procedure_recovered = true;\n\n\tg_frame_test_injection.acquire_suboptimal = true;\n\tif(!session.AcquireFrame() || !session.GetFrameReport().suboptimal || !session.PresentFrame() || !session.GetFrameReport().presented || !session.GetFrameReport().suboptimal) return false;\n\tg_frame_test_injection = VulkanFrameTestInjection();\n\tresult.acquire_suboptimal = true;\n\n\tif(!session.DestroyFrameState()) return false;\n\tg_frame_test_injection.acquire_out_of_date = true;''')

          # Capture validation cleanliness after real acquire/submit/present cycles.
          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\tif(!session.CreateSwapchain(Size(64, 64))) return false;\n\tsession.Close();''',
              '''\tif(!session.CreateSwapchain(Size(64, 64))) return false;\n\tif(session.GetReport().validation_warning_count != 0 || session.GetReport().validation_error_count != 0) return false;\n\tresult.validation_clean = true;\n\tsession.Close();''')

          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\t\tif(!second.AcquireFrame() || !second.PresentFrame()) return false;\n\t\tsecond.Close();''',
              '''\t\tif(!second.AcquireFrame() || !second.PresentFrame()) return false;\n\t\tif(first.GetReport().validation_warning_count != 0 || first.GetReport().validation_error_count != 0 || second.GetReport().validation_warning_count != 0 || second.GetReport().validation_error_count != 0) return false;\n\t\tsecond.Close();''')

          replace_once(
              'render/RenderVulkan/RenderVulkanFrame.cpp',
              '''\treturn result.no_swapchain_refused && result.acquire_present && result.repeat_present && result.duplicate_acquire_refused && result.missing_procedure_recovered && result.acquire_out_of_date && result.present_suboptimal && result.present_out_of_date && result.submit_failure_recovered && result.destroy_with_acquired_cleanup && result.destructor_cleanup && result.grouped_isolation && result.final_diag.runtime_live_count == 0''',
              '''\treturn result.no_swapchain_refused && result.acquire_present && result.repeat_present && result.duplicate_acquire_refused && result.missing_procedure_recovered && result.acquire_suboptimal && result.acquire_out_of_date && result.present_suboptimal && result.present_out_of_date && result.submit_failure_recovered && result.destroy_with_acquired_cleanup && result.destructor_cleanup && result.grouped_isolation && result.validation_clean && result.final_diag.runtime_live_count == 0''')

          # Extend focused evidence for acquire-suboptimal and validation-clean paths.
          replace_once(
              'render/RenderVulkan/RenderVulkanTestHooks.h',
              '''\tbool missing_procedure_recovered = false;\n\tbool acquire_out_of_date = false;''',
              '''\tbool missing_procedure_recovered = false;\n\tbool acquire_suboptimal = false;\n\tbool acquire_out_of_date = false;''')
          replace_once(
              'render/RenderVulkan/RenderVulkanTestHooks.h',
              '''\tbool destructor_cleanup = false;\n\tbool grouped_isolation = false;\n\tVulkanRuntimeDeviceDiagnostics final_diag;''',
              '''\tbool destructor_cleanup = false;\n\tbool grouped_isolation = false;\n\tbool validation_clean = false;\n\tVulkanRuntimeDeviceDiagnostics final_diag;''')

          replace_once(
              'tests/RenderVulkanFrameTest/main.cpp',
              '''\tok &= Check(result.missing_procedure_recovered, "missing frame procedures should recover on the same session");\n\tok &= Check(result.acquire_out_of_date, "acquire out-of-date state should be authoritative");''',
              '''\tok &= Check(result.missing_procedure_recovered, "missing frame procedures should recover on the same session");\n\tok &= Check(result.acquire_suboptimal, "suboptimal acquisition should remain successful and explicit");\n\tok &= Check(result.acquire_out_of_date, "acquire out-of-date state should be authoritative");''')
          replace_once(
              'tests/RenderVulkanFrameTest/main.cpp',
              '''\tok &= Check(result.grouped_isolation, "grouped sessions should keep frame state isolated");\n\tok &= Check(result.final_diag.runtime_live_count == 0 &&''',
              '''\tok &= Check(result.grouped_isolation, "grouped sessions should keep frame state isolated");\n\tok &= Check(result.validation_clean, "frame acquisition and presentation should remain validation-clean");\n\tok &= Check(result.final_diag.runtime_live_count == 0 &&''')

          # Bridge explicit frame work to the authoritative session-owned device/swapchain.
          replace_once(
              'render/RenderVulkan/RenderVulkan.cpp',
              '''const String& VulkanSurfaceSession::GetError() const\n{\n\treturn impl->error;\n}\n\nbool VulkanSurfaceSession::HasSwapchain() const''',
              '''const String& VulkanSurfaceSession::GetError() const\n{\n\treturn impl->error;\n}\n\nbool VulkanSurfaceSession::GetFrameInterop(FrameInterop& out) const\n{\n\tout.device = VK_NULL_HANDLE;\n\tout.graphics_queue = VK_NULL_HANDLE;\n\tout.present_queue = VK_NULL_HANDLE;\n\tout.swapchain = VK_NULL_HANDLE;\n\tout.images.Clear();\n\tout.graphics_queue_family_index = 0;\n\tout.swapchain_id = 0;\n\tout.get_device_proc_addr = nullptr;\n\tout.proc_filter = nullptr;\n\tif(!impl || !impl->lease.IsAcquired() || !impl->device.device)\n\t\treturn false;\n\tVulkanInstanceOwner *owner = impl->lease.GetOwner();\n\tif(!owner || !owner->instance.get_device_proc_addr)\n\t\treturn false;\n\tout.device = impl->device.device;\n\tout.graphics_queue = impl->device.graphics_queue;\n\tout.present_queue = impl->device.present_queue;\n\tout.swapchain = impl->swapchain.swapchain;\n\tfor(VkImage image : impl->swapchain.images)\n\t\tout.images.Add(image);\n\tout.graphics_queue_family_index = impl->report.graphics_queue_family_index >= 0 ? (uint32_t)impl->report.graphics_queue_family_index : 0;\n\tout.swapchain_id = impl->swapchain.diagnostic_id;\n\tout.get_device_proc_addr = owner->instance.get_device_proc_addr;\n\tout.proc_filter = owner->dispatch.proc_filter;\n\treturn out.graphics_queue != VK_NULL_HANDLE && out.present_queue != VK_NULL_HANDLE;\n}\n\nbool VulkanSurfaceSession::WaitFrameIdle(String& error)\n{\n\terror.Clear();\n\tif(!impl || !impl->device.device)\n\t\treturn true;\n\treturn impl->device.WaitIdle(error);\n}\n\nvoid VulkanSurfaceSession::SyncFrameValidation()\n{\n\tif(!impl)\n\t\treturn;\n\tif(VulkanInstanceOwner *owner = impl->lease.GetOwner())\n\t\tCopySurfaceValidationCapture(impl->report, owner->instance.capture);\n}\n\nbool VulkanSurfaceSession::HasSwapchain() const''')

          replace_once(
              'render/RenderVulkan/RenderVulkan.cpp',
              '''bool VulkanSurfaceSession::DestroySwapchain()\n{\n\tif(!impl || !impl->swapchain.swapchain)\n\t\treturn true;\n\tbool ok = impl->swapchain.Destroy(impl->device, impl->report.swapchain_error);\n\timpl->report.swapchain_state_cleared = impl->swapchain.IsCleared();\n\timpl->report.swapchain_cleanup_ok = impl->report.swapchain_cleanup_ok && ok;\n\treturn ok;\n}''',
              '''bool VulkanSurfaceSession::DestroySwapchain()\n{\n\tif(!impl)\n\t\treturn DestroyFrameState();\n\tbool frame_ok = DestroyFrameState();\n\tif(!impl->swapchain.swapchain)\n\t\treturn frame_ok;\n\tbool ok = impl->swapchain.Destroy(impl->device, impl->report.swapchain_error);\n\timpl->report.swapchain_state_cleared = impl->swapchain.IsCleared();\n\timpl->report.swapchain_cleanup_ok = impl->report.swapchain_cleanup_ok && ok;\n\treturn frame_ok && ok;\n}''')

          replace_once(
              'render/RenderVulkan/RenderVulkan.cpp',
              '''\tClose();\n\timpl->report = VulkanSurfaceReport();\n\timpl->error.Clear();''',
              '''\tClose();\n\timpl->report = VulkanSurfaceReport();\n\tframe_report = VulkanFrameReport();\n\timpl->error.Clear();''')

          replace_once(
              'render/RenderVulkan/RenderVulkan.cpp',
              '''void VulkanSurfaceSession::Close()\n{\n\tif(!impl)\n\t\treturn;\n\tCleanupSurfaceSession(*impl);\n\timpl->open = false;\n\timpl->ready = false;\n}''',
              '''void VulkanSurfaceSession::Close()\n{\n\tif(!impl)\n\t\treturn;\n\tbool frame_ok = DestroyFrameState();\n\tCleanupSurfaceSession(*impl);\n\tif(!frame_ok)\n\t\timpl->report.clean_shutdown = false;\n\timpl->open = false;\n\timpl->ready = false;\n}''')

          # Documentation: S12 is accepted; S13 is explicit-session acquisition/presentation only.
          replace_once(
              'README.md',
              '''- `tests/RenderVulkanTest`\n- `tests/RenderPlatformWin32Test`''',
              '''- `tests/RenderVulkanTest`\n- `tests/RenderVulkanFrameTest`\n- `tests/RenderPlatformWin32Test`''')
          replace_once(
              'README.md',
              '''- no Vulkan rendering backend yet; presentation and visible rendering still\n  are not implemented\n- private swapchain ownership is now available through `VulkanSurfaceSession`,\n  but frame acquisition, presentation, and visible rendering are not\n- no other GPU backend yet\n- no frame acquisition or presentation path yet''',
              '''- no Vulkan rendering backend yet; visible rendering is still not implemented\n- private swapchain ownership plus explicit frame acquisition and presentation are\n  available through `VulkanSurfaceSession`; this path currently performs only the\n  synchronization and image-layout work required for a valid presentation\n- no other GPU backend yet\n- `GpuCtrl` does not automatically create a swapchain, acquire frames, or present yet''')

          replace_once(
              'docs/PROJECT_PLAN.md',
              '''Next milestone: surface and platform design, followed by swapchain and present\nlifecycle work.''',
              '''Surface/platform bring-up, grouped ownership, and private swapchain lifecycle\nare complete. The active milestone is explicit frame acquisition and presentation;\nvisible rendering follows after that boundary is accepted.''')
          replace_once(
              'docs/PROJECT_PLAN.md',
              '''- TASK-008A1 S12 private Vulkan swapchain ownership is implemented and\n  awaiting final acceptance\n- grouped sessions share runtime and instance state while logical devices,\n  queues and surfaces remain owned per session\n- ordinary GpuCtrl instances remain isolated through their default session groups\n- swapchain and rendering remain unimplemented\n- frame acquisition and presentation remain deferred; the clear-colour\n  presented-frame demo remains the next visible milestone''',
              '''- TASK-008A1 S12 private Vulkan swapchain ownership is accepted\n- TASK-008A1 S13 explicit Vulkan frame acquisition and presentation is implemented\n  and awaiting Windows/runtime acceptance\n- grouped sessions share runtime and instance state while logical devices,\n  queues, surfaces, swapchains, and frame state remain owned per session\n- ordinary GpuCtrl instances remain isolated through their default session groups\n- private swapchain plus explicit acquisition/presentation are implemented; visible\n  rendering remains unimplemented\n- the clear-colour presented-frame path remains the next visible milestone after S13''')

          replace_once(
              'docs/GPU_CTRL_INTEGRATION.md',
              '''Surface/device readiness and private swapchain readiness are separate states.\nSwapchain ownership exists for explicit Vulkan sessions, but frame acquisition,\npresentation and visible rendering are not implemented yet.''',
              '''Surface/device readiness and private swapchain readiness are separate states.\nExplicit `VulkanSurfaceSession` instances now provide manual frame acquisition and\npresentation, but current `GpuCtrl` instances do not invoke that path automatically.\nVisible rendering is not implemented yet.''')
          PY

          git diff --check
          git status --short
          git diff --stat

          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add \
            render/RenderVulkan/RenderVulkan.upp \
            render/RenderVulkan/RenderVulkanSurfaceSession.h \
            render/RenderVulkan/RenderVulkanTestHooks.h \
            render/RenderVulkan/RenderVulkan.cpp \
            render/RenderVulkan/RenderVulkanFrame.cpp \
            tests/RenderVulkanFrameTest/RenderVulkanFrameTest.upp \
            tests/RenderVulkanFrameTest/main.cpp \
            README.md \
            docs/PROJECT_PLAN.md \
            docs/GPU_CTRL_INTEGRATION.md
          git diff --cached --check
          git commit \
            -m "TASK-008A1-S13: add Vulkan frame acquisition and presentation" \
            -m "Add explicit acquire/submit/present lifecycle with Vulkan 1.3 synchronization and authoritative suboptimal/out-of-date reporting." \
            -m "Keep frame state private per surface session, clean it before swapchain teardown, and preserve grouped-session isolation." \
            -m "Add focused frame acceptance coverage while retaining the existing S12 regression suite unchanged."
          git push --force origin HEAD:refs/heads/chatgpt/s13-candidate
