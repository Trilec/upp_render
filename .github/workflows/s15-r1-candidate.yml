name: Build S15-R2 candidate

on:
  push:
    branches:
      - chatgpt/s15-r1-resize-recovery

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded S15-R2 Windows clamp correction
        shell: bash
        run: |
          set -euo pipefail
          BASE=663ae3059b428353aa4f69fd7731bb597447818a
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git checkout --detach "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('render/GpuCtrl/GpuCtrl.cpp')
          s = p.read_text()
          old = "\t\treturn Size(max(0, rect.right - rect.left), max(0, rect.bottom - rect.top));\n"
          new = "\t\tLONG width = rect.right - rect.left;\n\t\tLONG height = rect.bottom - rect.top;\n\t\treturn Size(width > 0 ? (int)width : 0, height > 0 ? (int)height : 0);\n"
          assert s.count(old) == 1, 'native-size clamp anchor mismatch'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "render/GpuCtrl/GpuCtrl.cpp"
          git diff -- render/GpuCtrl/GpuCtrl.cpp
          git add render/GpuCtrl/GpuCtrl.cpp
          git -c user.name=ChatGPT -c user.email=chatgpt@users.noreply.github.com commit \
            -m "S15-R2 fix Windows native-size clamp" \
            -m "Avoid the ambiguous U++ max overload when converting the Win32 child client rectangle to Size." \
            -m "Keep the S15-R1 resize recovery logic and focused acceptance test unchanged."
          git push origin HEAD:refs/heads/chatgpt/s15-r2-candidate --force
