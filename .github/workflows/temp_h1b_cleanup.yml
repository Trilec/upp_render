name: Temporary H1b cleanup patch

on:
  push:
    branches:
      - supervisor/h1b-final-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supervisor/h1b-final-cleanup
      - name: Apply H1b synchronization and residue cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          path = Path('render/RenderVulkan/RenderVulkan.cpp')
          s = path.read_text()

          s = replace_once(s,
          '''\tPFN_vkDestroyDevice destroy_device = nullptr;\n\tPFN_vkGetDeviceQueue get_device_queue = nullptr;\n\tPFN_vkDeviceWaitIdle device_wait_idle = nullptr;\n\tVkPipelineCache pipeline_cache = VK_NULL_HANDLE;''',
          '''\tPFN_vkDestroyDevice destroy_device = nullptr;\n\tPFN_vkGetDeviceQueue get_device_queue = nullptr;\n\tPFN_vkDeviceWaitIdle device_wait_idle = nullptr;\n\tPFN_vkQueueWaitIdle queue_wait_idle = nullptr;\n\tVkPipelineCache pipeline_cache = VK_NULL_HANDLE;''',
          'device function fields')

          s = replace_once(s,
          '''\t\treturn physical_device == VK_NULL_HANDLE && device == VK_NULL_HANDLE && graphics_queue == VK_NULL_HANDLE && present_queue == VK_NULL_HANDLE && pipeline_cache == VK_NULL_HANDLE && destroy_device == nullptr && get_device_queue == nullptr && device_wait_idle == nullptr && destroy_pipeline_cache == nullptr && family_queues.IsEmpty();''',
          '''\t\treturn physical_device == VK_NULL_HANDLE && device == VK_NULL_HANDLE && graphics_queue == VK_NULL_HANDLE && present_queue == VK_NULL_HANDLE && pipeline_cache == VK_NULL_HANDLE && destroy_device == nullptr && get_device_queue == nullptr && device_wait_idle == nullptr && queue_wait_idle == nullptr && destroy_pipeline_cache == nullptr && family_queues.IsEmpty();''',
          'device cleared state')

          s = replace_once(s,
          '''\t\tdevice_wait_idle = nullptr;\n\t\tdestroy_pipeline_cache = nullptr;''',
          '''\t\tdevice_wait_idle = nullptr;\n\t\tqueue_wait_idle = nullptr;\n\t\tdestroy_pipeline_cache = nullptr;''',
          'device function clear')

          s = replace_once(s,
          '''\tbool WaitIdle(String& error)\n\t{\n\t\tif(!device)\n\t\t\treturn true;\n\t\tVkResult vr = VK_SUCCESS;\n\t\tif(g_validation_test_injection.point == VulkanValidationTestPoint::DuringDeviceCleanup && g_validation_test_injection.force_device_cleanup_failure)\n\t\t\tvr = g_validation_test_injection.device_cleanup_result;\n\t\telse\n\t\t\tvr = device_wait_idle ? device_wait_idle(device) : VK_ERROR_INITIALIZATION_FAILED;\n\t\tif(vr != VK_SUCCESS) {\n\t\t\terror = String("vkDeviceWaitIdle failed: ") + AsString((int)vr);\n\t\t\treturn false;\n\t\t}\n\t\treturn true;\n\t}\n''',
          '''\tbool WaitQueuesIdle(VkQueue graphics, VkQueue present, String& error)\n\t{\n\t\terror.Clear();\n\t\tif(!device || (!graphics && !present))\n\t\t\treturn true;\n\t\tif(!queue_wait_idle) {\n\t\t\terror = "vkQueueWaitIdle";\n\t\t\treturn false;\n\t\t}\n\t\tif(graphics) {\n\t\t\tVkResult vr = queue_wait_idle(graphics);\n\t\t\tif(vr != VK_SUCCESS) {\n\t\t\t\terror = String("vkQueueWaitIdle(graphics) failed: ") + AsString((int)vr);\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n\t\tif(present && present != graphics) {\n\t\t\tVkResult vr = queue_wait_idle(present);\n\t\t\tif(vr != VK_SUCCESS) {\n\t\t\t\terror = String("vkQueueWaitIdle(present) failed: ") + AsString((int)vr);\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n\t\treturn true;\n\t}\n''',
          'replace device-wide helper')

          old_resolve = '''\t\tif(!ResolveDeviceProc(get_device_queue, instance.dispatch->proc_filter, instance.get_device_proc_addr, device, "vkGetDeviceQueue", error)) return fail(error);\n\t\tif(!ResolveDeviceProc(device_wait_idle, instance.dispatch->proc_filter, instance.get_device_proc_addr, device, "vkDeviceWaitIdle", error)) return fail(error);'''
          new_resolve = old_resolve + '''\n\t\tif(!ResolveDeviceProc(queue_wait_idle, instance.dispatch->proc_filter, instance.get_device_proc_addr, device, "vkQueueWaitIdle", error)) return fail(error);'''
          if s.count(old_resolve) != 1:
              raise SystemExit(f'bootstrap queue-wait resolve: expected one compact match, got {s.count(old_resolve)}')
          s = s.replace(old_resolve, new_resolve, 1)

          old_shared = '''\t\tif(!ResolveDeviceProc(device_wait_idle, instance.dispatch->proc_filter, instance.get_device_proc_addr,\n\t\t                       device, "vkDeviceWaitIdle", error)) return fail(error);\n\t\tPFN_vkCreatePipelineCache create_pipeline_cache = nullptr;'''
          new_shared = '''\t\tif(!ResolveDeviceProc(device_wait_idle, instance.dispatch->proc_filter, instance.get_device_proc_addr,\n\t\t                       device, "vkDeviceWaitIdle", error)) return fail(error);\n\t\tif(!ResolveDeviceProc(queue_wait_idle, instance.dispatch->proc_filter, instance.get_device_proc_addr,\n\t\t                       device, "vkQueueWaitIdle", error)) return fail(error);\n\t\tPFN_vkCreatePipelineCache create_pipeline_cache = nullptr;'''
          s = replace_once(s, old_shared, new_shared, 'shared queue-wait resolve')

          s = replace_once(s,
          '''\tbool Destroy(VulkanDeviceContext& device, String& error)\n\t{\n\t\tbool idle_ok = device.WaitIdle(error);\n\t\tif(swapchain && destroy_swapchain)\n\t\t\tdestroy_swapchain(device.device, swapchain, nullptr);\n\t\telse if(swapchain)\n\t\t\tidle_ok = false;\n\t\tif(diagnostic_id) {\n\t\t\tg_runtime_device_stats.swapchain_live_count.fetch_sub(1, std::memory_order_relaxed);\n\t\t}\n\t\tClearState();\n\t\tcleanup_ok = cleanup_ok && idle_ok && IsCleared();\n\t\treturn cleanup_ok;\n\t}\n''',
          '''\tbool Destroy(VulkanDeviceContext& device)\n\t{\n\t\tbool ok = true;\n\t\tif(swapchain && destroy_swapchain && device.device)\n\t\t\tdestroy_swapchain(device.device, swapchain, nullptr);\n\t\telse if(swapchain)\n\t\t\tok = false;\n\t\tif(diagnostic_id)\n\t\t\tg_runtime_device_stats.swapchain_live_count.fetch_sub(1, std::memory_order_relaxed);\n\t\tClearState();\n\t\tcleanup_ok = cleanup_ok && ok && IsCleared();\n\t\treturn cleanup_ok;\n\t}\n''',
          'swapchain destroy')

          s = replace_once(s,
          '''\tif(error == "vkDestroyDevice" || error == "vkGetDeviceQueue" || error == "vkDeviceWaitIdle")''',
          '''\tif(error == "vkDestroyDevice" || error == "vkGetDeviceQueue" || error == "vkDeviceWaitIdle" || error == "vkQueueWaitIdle")''',
          'device error mapping')

          s = replace_once(s,
          '''bool VulkanSurfaceSession::WaitFrameIdle(String& error)\n{\n\terror.Clear();\n\tif(!impl || !impl->device || !impl->device->device)\n\t\treturn true;\n\treturn impl->device->WaitIdle(error);\n}\n''',
          '''bool VulkanSurfaceSession::WaitFrameIdle(String& error)\n{\n\terror.Clear();\n\tif(!impl || !impl->device || !impl->device->device)\n\t\treturn true;\n\treturn impl->device->WaitQueuesIdle(impl->graphics_queue, impl->present_queue, error);\n}\n''',
          'session queue-scoped wait')

          s = s.replace('impl->swapchain.Destroy(*impl->device, impl->report.swapchain_error)', 'impl->swapchain.Destroy(*impl->device)')
          s = s.replace('impl.swapchain.Destroy(*impl.device, impl.error)', 'impl.swapchain.Destroy(*impl.device)')
          if 'swapchain.Destroy(*impl->device,' in s or 'swapchain.Destroy(*impl.device,' in s:
              raise SystemExit('stale swapchain Destroy call remains')

          s = replace_once(s,
          '''\t\tString idle_error;\n\t\tbool idle_ok = impl->device->WaitIdle(idle_error);\n\t\tdestroy_swapchain(impl->device->device, created, nullptr);\n\t\tg_runtime_device_stats.swapchain_live_count.fetch_sub(1, std::memory_order_relaxed);\n\t\timpl->report.swapchain_cleanup_ok = impl->report.swapchain_cleanup_ok && idle_ok;''',
          '''\t\t// The newly created swapchain has never been submitted or presented; rollback\n\t\t// therefore needs no queue/device idle boundary before destruction.\n\t\tdestroy_swapchain(impl->device->device, created, nullptr);\n\t\tg_runtime_device_stats.swapchain_live_count.fetch_sub(1, std::memory_order_relaxed);''',
          'creation rollback wait removal')

          s = replace_once(s,
          '''\tif(session.CreateSwapchain(Size(64, 64)) || session.GetReport().swapchain_error != "injected swapchain image enumeration failure" || session.GetReport().swapchain_cleanup_ok || GetVulkanRuntimeDeviceDiagnostics().swapchain_live_count != 0) return false;\n\tClearVulkanValidationTestInjection();\n\tif(!session.CreateSwapchain(Size(64, 64)) || !session.DestroySwapchain() || session.GetReport().swapchain_cleanup_ok) return false;\n\tresult.rollback_cleanup_sticky = true;''',
          '''\tif(session.CreateSwapchain(Size(64, 64)) || session.GetReport().swapchain_error != "injected swapchain image enumeration failure" || !session.GetReport().swapchain_cleanup_ok || GetVulkanRuntimeDeviceDiagnostics().swapchain_live_count != 0) return false;\n\tClearVulkanValidationTestInjection();\n\tif(!session.CreateSwapchain(Size(64, 64)) || !session.DestroySwapchain() || !session.GetReport().swapchain_cleanup_ok) return false;\n\tresult.rollback_cleanup_independent = true;''',
          'rollback cleanup independence')

          s = replace_once(s,
          '''\tif(rollback_diag.swapchain_create_count != create_before_rollback + 1 || rollback_diag.swapchain_live_count != 0 || !session.GetReport().swapchain_state_cleared || session.GetReport().swapchain_cleanup_ok) return false;''',
          '''\tif(rollback_diag.swapchain_create_count != create_before_rollback + 1 || rollback_diag.swapchain_live_count != 0 || !session.GetReport().swapchain_state_cleared || !session.GetReport().swapchain_cleanup_ok) return false;''',
          'rollback report remains clean')

          s = replace_once(s,
          '''\t\tif(idle_report.swapchain_cleanup_ok || !idle_report.cleanup_state_cleared || idle_report.clean_shutdown || idle_diag.swapchain_live_count != 0 || idle_diag.device_live_count != 0 || idle_diag.surface_live_count != 0 || idle_diag.instance_live_count != 0 || idle_diag.runtime_live_count != 0) return false;\n\t\tresult.active_idle_failure_cleanup = true;''',
          '''\t\tif(!idle_report.swapchain_cleanup_ok || idle_report.device_cleanup_ok || !idle_report.cleanup_state_cleared || idle_report.clean_shutdown || idle_diag.swapchain_live_count != 0 || idle_diag.device_live_count != 0 || idle_diag.surface_live_count != 0 || idle_diag.instance_live_count != 0 || idle_diag.runtime_live_count != 0) return false;\n\t\tresult.device_cleanup_does_not_poison_swapchain = true;''',
          'device cleanup isolation')

          s = s.replace('result.rollback_cleanup_sticky', 'result.rollback_cleanup_independent')
          s = s.replace('result.active_idle_failure_cleanup', 'result.device_cleanup_does_not_poison_swapchain')

          if 'WaitIdle(' in s:
              raise SystemExit('migration-only WaitIdle helper/call remains in RenderVulkan.cpp')
          path.write_text(s)

          path = Path('render/RenderVulkan/RenderVulkanTestHooks.h')
          s = path.read_text()
          s = s.replace('bool active_idle_failure_cleanup = false;', 'bool device_cleanup_does_not_poison_swapchain = false;')
          s = s.replace('bool rollback_cleanup_sticky = false;', 'bool rollback_cleanup_independent = false;')
          if 'active_idle_failure_cleanup' in s or 'rollback_cleanup_sticky' in s:
              raise SystemExit('stale swapchain test-hook names remain')
          path.write_text(s)

          path = Path('tests/RenderVulkanTest/main.cpp')
          s = path.read_text()
          s = replace_once(s,
          '''\tif(!Check(result.compatible_shared && result.grouped_swapchains_separate && result.compatible_registry_entries == 1 && result.compatible_acquire_count == 2 && result.compatible_diag.runtime_create_count == 1 && result.compatible_diag.instance_create_count == 1 && result.compatible_diag.surface_create_count == 2 && result.compatible_diag.device_create_count == 2, "compatible grouped sessions should share runtime and instance only")) return false;''',
          '''\tif(!Check(result.compatible_shared && result.grouped_swapchains_separate && result.compatible_registry_entries == 1 && result.compatible_acquire_count == 2 && result.compatible_diag.runtime_create_count == 1 && result.compatible_diag.instance_create_count == 1 && result.compatible_diag.surface_create_count == 2 && result.compatible_diag.device_create_count == 1 && result.compatible_diag.device_live_count == 1, "compatible grouped sessions should share runtime, instance and one logical device while retaining two surfaces")) return false;''',
          'grouped shared-device authority')
          s = s.replace('result.active_idle_failure_cleanup', 'result.device_cleanup_does_not_poison_swapchain')
          s = s.replace('result.rollback_cleanup_sticky', 'result.rollback_cleanup_independent')
          s = s.replace('"swapchain refusal, rollback, incomplete recovery, idle cleanup and destructor cleanup should be explicit"', '"swapchain refusal, rollback, cleanup isolation, incomplete recovery and destructor cleanup should be explicit"')
          old_missing = '''static bool TestMissingDeviceFunction()\n{\n\tVulkanBootstrapReport report = RunBootstrap(false, true, "vkCreateDevice");\n\tif(!Check(report.status == VulkanProbeStatus::RequiredLoaderFunctionUnavailable, "missing device function should be reported")) return false;\n\tif(!Check(report.instance_error == "vkCreateDevice", "missing device function name should be preserved")) return false;\n\tif(!Check(report.cleanup_state_cleared, "missing device function should still clear state")) return false;\n\treturn Check(report.clean_shutdown, "missing device function should clean up what it can");\n}\n'''
          new_missing = '''static bool TestMissingDeviceFunction()\n{\n\tVulkanBootstrapReport report = RunBootstrap(false, true, "vkCreateDevice");\n\tif(!Check(report.status == VulkanProbeStatus::RequiredLoaderFunctionUnavailable, "missing device function should be reported")) return false;\n\tif(!Check(report.instance_error == "vkCreateDevice", "missing device function name should be preserved")) return false;\n\tif(!Check(report.cleanup_state_cleared, "missing device function should still clear state")) return false;\n\tif(!Check(report.clean_shutdown, "missing device function should clean up what it can")) return false;\n\n\tVulkanBootstrapReport queue_wait = RunBootstrap(false, true, "vkQueueWaitIdle");\n\tif(!Check(queue_wait.status == VulkanProbeStatus::RequiredLoaderFunctionUnavailable, "missing queue-wait function should be reported")) return false;\n\tif(!Check(queue_wait.device_error == "vkQueueWaitIdle", "missing queue-wait function name should be preserved")) return false;\n\tif(!Check(queue_wait.cleanup_state_cleared, "missing queue-wait function should still clear state")) return false;\n\treturn Check(queue_wait.clean_shutdown, "missing queue-wait function should clean up what it can");\n}\n'''
          s = replace_once(s, old_missing, new_missing, 'queue wait missing-proc coverage')
          if 'device_create_count == 2, "compatible grouped sessions' in s or 'share runtime and instance only' in s:
              raise SystemExit('stale two-device grouped assumption remains')
          path.write_text(s)

          path = Path('render/RenderGpu2D/RenderGpu2D.cpp')
          s = path.read_text()
          s = replace_once(s,
          '''// Keep the accepted Stage-4/image renderer byte-preserved. Stage-5 wrappers\n// only intercept features the accepted base does not know about; vector/SVG\n// content is materialized into ordinary DrawImage intent before reaching it.''',
          '''// Keep the base replay and feature extensions in one translation unit so text/vector\n// wrappers can reuse UiRenderer2D private state without publishing a second internal API.\n// Vector/SVG content is materialized into ordinary DrawImage intent before replay.''',
          'RenderGpu2D inc rationale')
          path.write_text(s)

          path = Path('render/RenderVulkan/RenderVulkanRhi.cpp')
          s = path.read_text()
          s = replace_once(s,
          '''// Preserve the accepted Stage-3/Stage-4 adapter byte-for-byte and rename only\n// the entry points whose behaviour Stage 5 must extend. The public wrappers\n// below add sampled-image state without forking resource/frame ownership.''',
          '''// Keep the core RHI and sampled-texture extension in one translation unit so the\n// wrappers can reuse VulkanGpuDevice private Impl state without publishing backend\n// internals. The renamed base entry points are deliberate internal layering, not a\n// compatibility API.''',
          'RenderVulkanRhi inc rationale')
          path.write_text(s)
          PY

          git diff --check
          ! grep -R "active_idle_failure_cleanup\|rollback_cleanup_sticky\|share runtime and instance only" render tests
          ! grep -R "WaitIdle(" render/RenderVulkan/RenderVulkan.cpp
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add render/RenderVulkan/RenderVulkan.cpp render/RenderVulkan/RenderVulkanTestHooks.h tests/RenderVulkanTest/main.cpp render/RenderGpu2D/RenderGpu2D.cpp render/RenderVulkan/RenderVulkanRhi.cpp
          git commit -m "TEMP H1b narrow Vulkan cleanup synchronization" \
            -m "Use queue-scoped frame teardown, remove redundant rollback waits, correct shared-device acceptance, and document retained internal .inc layering."
          git push origin HEAD:supervisor/h1b-final-cleanup
