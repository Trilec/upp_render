name: Run guarded S16D builder

on:
  push:
    branches:
      - chatgpt/s16d-builder

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate from accepted S16C
        shell: bash
        run: |
          set -euo pipefail
          BASE=332c3bd34527dd15be4404fd5a8398e815731423
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          cp .github/s16d_edit.py /tmp/s16d_edit.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/s16d_edit.py')
          s = p.read_text()
          old = "\\t\\tdraw_rects = clone(*rects);\\n"
          new = "\\t\\tdraw_rects.SetCount(rects->GetCount());\\n\\t\\tfor(int i = 0; i < rects->GetCount(); ++i)\\n\\t\\t\\tdraw_rects[i] = (*rects)[i];\\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          git checkout --detach "$BASE"
          python /tmp/s16d_edit.py
          git diff --check
          git diff --stat
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/PROJECT_PLAN.md render/GpuCtrl/GpuCtrl.cpp render/RenderVulkan/RenderVulkanClearFrame.cpp render/RenderVulkan/RenderVulkanSurfaceSession.h tests/RenderVulkanClearFrameTest/main.cpp | sort)"
          git add docs/PROJECT_PLAN.md render/GpuCtrl/GpuCtrl.cpp render/RenderVulkan/RenderVulkanClearFrame.cpp render/RenderVulkan/RenderVulkanSurfaceSession.h tests/RenderVulkanClearFrameTest/main.cpp
          git -c user.name=ChatGPT -c user.email=chatgpt@users.noreply.github.com commit -m "TASK-008A1-S16D: replay ordered FillRects in GpuCtrl" -m "Extend the FillRect-only neutral replay proof from one operation to ordered operations and carry two fills through one Vulkan dynamic-rendering frame." -m "Keep transforms, clipping, strokes, rounded rectangles, shaders, pipelines and general renderer state deferred."
          git push origin HEAD:refs/heads/chatgpt/s16d-candidate --force
