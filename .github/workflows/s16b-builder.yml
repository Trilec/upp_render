name: Run guarded S16B builder

on:
  push:
    branches:
      - chatgpt/s16b-builder

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate from accepted S16A
        shell: bash
        run: |
          set -euo pipefail
          BASE=394f6bd918cb15a5df7f9c9d2e9a88e40ced2ee2
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git show origin/chatgpt/s16b-builder:.github/s16b_edit.py > /tmp/s16b_edit.py
          git checkout --detach "$BASE"
          python3 /tmp/s16b_edit.py
          git diff --check
          git diff --stat
          git diff -- render/GpuCtrl/GpuCtrl.cpp docs/PROJECT_PLAN.md
          test "$(git diff --name-only | wc -l)" -eq 2
          git add render/GpuCtrl/GpuCtrl.cpp docs/PROJECT_PLAN.md
          git -c user.name=ChatGPT -c user.email=chatgpt@users.noreply.github.com commit -m "TASK-008A1-S16B: add backend-neutral GpuCtrl frame intent" -m "Move the S16A background and filled-rectangle description above the private backend boundary so Vulkan consumes neutral frame intent instead of inventing control content." -m "Keep GpuCtrl public API, display-list replay, shaders, pipelines, and general 2D rendering deferred."
          git push origin HEAD:refs/heads/chatgpt/s16b-candidate --force
