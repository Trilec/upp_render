name: Temporary P6a semantic refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'supervisor/p6a-shared-device'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supervisor/p6a-shared-device
          fetch-depth: 0
      - name: Refine device-creation validation hook
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('render/RenderVulkan/RenderVulkan.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''\tif(request_validation)\n\t\tInjectValidationIfRequested(owner->instance.capture, VulkanValidationTestPoint::AfterDeviceCreation);'''
          new = '''\tif(request_validation && device_newly_created)\n\t\tInjectValidationIfRequested(owner->instance.capture, VulkanValidationTestPoint::AfterDeviceCreation);'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one AfterDeviceCreation hook, got {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Commit refined source only
        shell: bash
        run: |
          rm -rf .github
          git config user.name "upp_render supervisor"
          git config user.email "Trilec@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -v '^.github/' || true)" = "render/RenderVulkan/RenderVulkan.cpp"
          git commit -m "P6a refine shared-device creation semantics"
          git push origin HEAD:supervisor/p6a-shared-device
